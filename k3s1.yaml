  name: minio-init-buckets
  namespace: obs-system
  labels:
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: minio
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obs-poc
        obs.poc/component: minio
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-10-08T09-37-26Z
          env:
            - name: MINIO_ACCESS
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: MINIO_SECRET
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "waiting for minio..."
              for i in $(seq 1 60); do
                mc alias set local http://minio.obs-system:9000 "$MINIO_ACCESS" "$MINIO_SECRET" && break
                sleep 3
              done
              mc mb -p local/obs-archive-medium || true
              mc mb -p local/obs-archive-low || true
              mc ls local
              echo "buckets ready"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
