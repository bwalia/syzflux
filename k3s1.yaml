# ========== Query API ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: obs-system
  labels:
    app: query-api
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: query-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-api
  template:
    metadata:
      labels:
        app: query-api
        app.kubernetes.io/part-of: obs-poc
        obs.poc/component: query-api
    spec:
      containers:
        - name: query-api
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              set -e
              pip install --no-cache-dir minio==7.2.9 requests==2.32.3
              exec python /app/main.py
          env:
            - name: OPENSEARCH_URL
              value: http://opensearch.obs-system.svc.cluster.local:9200
            - name: STREAMA_URL
              value: http://streama-lite.obs-system.svc.cluster.local:8080
            - name: MINIO_ENDPOINT
              value: minio.obs-system.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
            - name: MINIO_SECURE
              value: "false"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: query-api-code
---
