# k3s1.yaml - Next-gen observability POC (stream-first)
# Apply:  kubectl apply -f k3s1.yaml
# Target: k3s. Cold store = MinIO. Hot store = OpenSearch. Stream = Redpanda/Kafka API.
# KUBECONFIG example: export KUBECONFIG=~/.kube/k3s1.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: obs-system
  labels:
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
  labels:
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: namespace
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-noise
  labels:
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: namespace
---
# ========== Secrets ==========
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: obs-system
  labels:
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: minio
type: Opaque
stringData:
  accesskey: minioadmin
  secretkey: minioadmin123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-api-code
  namespace: demo-apps
  labels:
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: config
data:
  main.py: |
    #!/usr/bin/env python3
    """checkout-api: High TCO sample app."""
    import json, os, random, time, uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PRIORITY = os.environ.get("TCO_PRIORITY", "high")
    APP = os.environ.get("APP_NAME", "checkout-api")


    def log(level, message, **fields):
        rec = {
            "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
            "level": level,
            "app": APP,
            "priority": PRIORITY,
            "message": message,
            **fields,
        }
        print(json.dumps(rec), flush=True)


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            return

        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path.startswith("/healthz"):
                self._send(200, {"status": "ok"})
                return
            if self.path.startswith("/checkout"):
                order_id = str(uuid.uuid4())[:8]
                latency = random.randint(20, 400)
                fail = "fail=1" in self.path or random.random() < 0.08
                if fail:
                    log("ERROR", "checkout failed", order_id=order_id, latency_ms=latency, error="payment_declined")
                    self._send(500, {"ok": False, "order_id": order_id, "error": "payment_declined"})
                else:
                    log("INFO", "checkout ok", order_id=order_id, latency_ms=latency)
                    self._send(200, {"ok": True, "order_id": order_id})
                return
            self._send(404, {"error": "not found"})


    if __name__ == "__main__":
        log("INFO", "starting checkout-api")
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-code
  namespace: demo-apps
  labels:
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: config
data:
  main.py: |
    #!/usr/bin/env python3
    """catalog-api: Medium TCO sample app."""
    import json, os, random, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    PRIORITY = os.environ.get("TCO_PRIORITY", "medium")
    APP = os.environ.get("APP_NAME", "catalog-api")
    ITEMS = ["sku-100", "sku-200", "sku-300", "sku-400"]


    def log(level, message, **fields):
        print(json.dumps({
            "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
            "level": level,
            "app": APP,
            "priority": PRIORITY,
            "message": message,
            **fields,
        }), flush=True)


    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            return

        def _send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            if self.path.startswith("/healthz"):
                self._send(200, {"status": "ok"})
                return
            if self.path.startswith("/catalog"):
                item = random.choice(ITEMS)
                log("INFO", "catalog lookup", item=item, latency_ms=random.randint(5, 80))
                self._send(200, {"item": item, "in_stock": True})
                return
            self._send(404, {"error": "not found"})


    if __name__ == "__main__":
        log("INFO", "starting catalog-api")
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
