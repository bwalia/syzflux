# ========== Streama-lite ==========
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streama-lite
  namespace: obs-system
  labels:
    app: streama-lite
    app.kubernetes.io/part-of: obs-poc
    obs.poc/component: streama-lite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streama-lite
  template:
    metadata:
      labels:
        app: streama-lite
        app.kubernetes.io/part-of: obs-poc
        obs.poc/component: streama-lite
    spec:
      containers:
        - name: streama-lite
          image: python:3.12-slim
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apt-get update -qq && apt-get install -y -qq libsnappy1v5 >/dev/null
              pip install --no-cache-dir kafka-python-ng==2.2.3 python-snappy==0.7.3 minio==7.2.9 requests==2.32.3
              exec python /app/main.py
          env:
            - name: KAFKA_BOOTSTRAP
              value: redpanda.obs-system.svc.cluster.local:9092
            - name: OPENSEARCH_URL
              value: http://opensearch.obs-system.svc.cluster.local:9200
            - name: MINIO_ENDPOINT
              value: minio.obs-system.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: secretkey
            - name: MINIO_SECURE
              value: "false"
            - name: ALERT_ERROR_THRESHOLD
              value: "5"
            - name: ALERT_WINDOW_SEC
              value: "60"
            - name: COLD_FLUSH_SEC
              value: "10"
            - name: COLD_FLUSH_SIZE
              value: "15"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 5
